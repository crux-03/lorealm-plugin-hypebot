<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        padding: var(--spacing-xs, 4px) 0;
        display: flex;
        align-items: flex-end;
        gap: var(--spacing-sm, 8px);
        font-family: var(--font-family-body, sans-serif);
        font-size: var(--font-size-sm);
        color: var(--color-text-primary);
      }
      #bot {
        flex: none;
        width: 32px;
        height: 32px;
        padding: 0;
        border: none;
        background: none;
        color: var(--color-primary);
        cursor: pointer;
      }
      #bot:hover {
        color: var(--color-primary-light);
      }
      #bot:disabled {
        cursor: default;
      }
      #bot svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .thinking #bot svg {
        animation: bob 0.8s ease-in-out infinite alternate;
      }
      @keyframes bob {
        to {
          transform: translateY(-3px);
        }
      }
      #bubble {
        position: relative;
        max-width: 60ch;
        margin-bottom: 6px;
        padding: 6px 12px;
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-lg, 12px);
        border-bottom-left-radius: 2px;
        background: var(--color-bg-elevated);
        line-height: 1.4;
        animation: pop 0.15s ease-out;
      }
      #bubble[hidden] {
        display: none;
      }
      #bubble.error {
        color: var(--color-error-text);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
    </style>
  </head>
  <body>
    <button id="bot" type="button" title="What does HypeBot think?">
      <!-- SVG is generated by Claude -->
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <line x1="16" y1="3" x2="16" y2="8" stroke="currentColor" stroke-width="2" />
        <circle cx="16" cy="3" r="2" fill="currentColor" />
        <rect x="4" y="8" width="24" height="19" rx="6" fill="currentColor" />
        <rect x="1" y="14" width="3" height="7" rx="1.5" fill="currentColor" />
        <rect x="28" y="14" width="3" height="7" rx="1.5" fill="currentColor" />
        <circle cx="11.5" cy="16" r="2.5" fill="var(--color-bg-base, #fff)" />
        <circle cx="20.5" cy="16" r="2.5" fill="var(--color-bg-base, #fff)" />
        <path
          d="M11 21.5q5 3.5 10 0"
          fill="none"
          stroke="var(--color-bg-base, #fff)"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>
    <div id="bubble" hidden></div>
    <script>
      const bot = document.getElementById('bot');
      const bubble = document.getElementById('bubble');
      let conversation = lorealm.context.conversation;

      function say(text, error = false) {
        document.body.classList.remove('thinking');
        bot.disabled = false;
        bubble.hidden = !text;
        bubble.textContent = text ?? '';
        bubble.classList.toggle('error', error);
      }

      function think() {
        document.body.classList.add('thinking');
        bot.disabled = true;
        bubble.hidden = false;
        bubble.classList.remove('error');
        bubble.textContent = '…';
      }

      async function show() {
        say(null);
        if (conversation) say(await lorealm.call('last').catch(() => null));
      }

      bot.onclick = async () => {
        if (!conversation) return say('Open a chat first.', true);
        think();
        try {
          say(await lorealm.call('comment'));
        } catch (e) {
          say(e.message, true);
        }
      };

      lorealm.on('thinking', (p) => p.conversation === conversation && think());
      lorealm.on('comment', (p) => {
        if (p.conversation !== conversation) return;
        if (p.error) say(p.error, true);
        else say(p.text);
      });

      lorealm.onContext((context) => {
        if (context.conversation === conversation) return;
        conversation = context.conversation;
        show();
      });
      show();
    </script>
  </body>
</html>
